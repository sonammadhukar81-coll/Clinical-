<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMS Clinical Diary</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#245b4a">
<style>
body{margin:0;background:#f5f3ee;color:#18201c;font-family:system-ui,sans-serif}header{background:#245b4a;color:white;padding:18px;position:sticky;top:0;z-index:3}header div{max-width:1050px;margin:auto}main{max-width:1050px;margin:auto;padding:15px}.grid{display:grid;grid-template-columns:290px 1fr;gap:15px}.card{background:white;border:1px solid #e3e0d8;border-radius:18px;padding:15px}.search,input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #ddd8ce;border-radius:10px;padding:10px;font:inherit}textarea{min-height:95px;resize:vertical}.topic{padding:9px;border-bottom:1px solid #eee;cursor:pointer}.topic.active{background:#e9f0ec;border-radius:8px}.cat{font-size:11px;font-weight:800;color:#69736d;text-transform:uppercase;margin:14px 0 5px}.list{max-height:72vh;overflow:auto}.spin{background:#faf8f3;text-align:center;padding:15px;border-radius:13px;margin-bottom:14px}.btn{border:1px solid #ddd8ce;background:white;border-radius:10px;padding:10px 13px;font-weight:700}.primary{background:#245b4a;color:white;border-color:#245b4a}.section{border-top:1px solid #eee;margin-top:14px;padding-top:12px}.section b{display:block;margin-bottom:5px}.hint{font-size:12px;color:#69736d;margin-bottom:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#faf9f6;padding:9px;border-radius:9px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#69736d}@media(max-width:750px){.grid{grid-template-columns:1fr}.list{max-height:32vh}}
</style></head><body><header><div><b style="font-size:22px">🩺 BAMS Clinical Diary</b><br><small>Spin → learn → write → practice → revise</small></div></header>
<main><div class="grid"><aside class="card"><button class="btn primary" id="spin">🎡 SPIN TODAY'S TOPIC</button><br><br><input class="search" id="search" placeholder="Search topic..."><div id="list" class="list"></div><div class="stats"><div class="stat"><b id="done">0</b><span>completed</span></div><div class="stat"><b id="notes">0</b><span>with notes</span></div><div class="stat"><b id="streak">0</b><span>streak</span></div></div></aside>
<section class="card"><div class="spin"><small>TODAY'S TOPIC</small><h2 id="result">Spin when ready 🎡</h2></div><div id="editor"><p style="color:#69736d">Spin or choose a topic. I'll give you a diary page with all the sections you need.</p></div></section></div></main>
<script>
const DATA={"Clinical Skills": ["Blood Pressure Measurement", "Pulse Examination", "Respiratory Rate", "Temperature Measurement", "SpO₂ Measurement", "General Physical Examination", "Pallor Examination", "Icterus Examination", "Cyanosis Examination", "Clubbing Examination", "Lymph Node Examination", "Edema Examination", "Dehydration Assessment", "JVP Examination", "BMI & Nutritional Assessment", "Abdominal Examination", "Respiratory System Examination", "Cardiovascular Examination", "Neurological Examination", "Thyroid Examination", "History Taking", "Case Sheet Writing"], "Medicine": ["Hypertension", "Diabetes Mellitus", "Anemia", "Fever Approach", "Asthma", "COPD", "Pneumonia", "Tuberculosis", "Heart Failure", "Ischemic Heart Disease", "Stroke", "Jaundice", "Hepatitis", "UTI", "Chronic Kidney Disease", "Hypothyroidism", "Hyperthyroidism", "Obesity", "GERD", "Peptic Ulcer Disease", "Diarrhea", "Dengue", "Malaria", "Typhoid", "Rheumatoid Arthritis", "Osteoarthritis", "Gout", "Sepsis"], "Ayurveda Clinical": ["Jwara", "Prameha", "Pandu", "Kamala", "Shotha", "Kasa", "Shwasa", "Raktapitta", "Arsha", "Grahani", "Amlapitta", "Aamavata", "Sandhivata", "Vatarakta", "Pakshaghata", "Ekangavata", "Gridhrasi", "Mutrakrichra", "Ashmari", "Atisara", "Chhardi", "Hikka", "Rasayana", "Nidana Panchaka", "Rogi Pariksha", "Dashavidha Pariksha"], "Foundations": ["Dosha Assessment", "Prakriti", "Vikriti", "Agni Assessment", "Koshtha", "Bala Assessment", "Satmya", "Nadi Pariksha", "Mutra Pariksha", "Mala Pariksha", "Jihva Pariksha", "Sparsha Pariksha", "Drik Pariksha", "Srotas Assessment", "Samprapti Ghataka", "Upashaya-Anupashaya", "Purvarupa vs Rupa", "Nidana Panchaka Revision"]};let S=JSON.parse(localStorage.getItem("bamsDiary")||"{}"),sel=null;
const flat=Object.entries(DATA).flatMap(([c,a])=>a.map(x=>({c,x})));
const fields=[
["what","🧠 1. WHAT IS IT?","Definition + one-line concept + 2–3 key points."],
["presentation","👤 2. HOW WILL THE PATIENT PRESENT?","Complaints, symptoms, important red flags."],
["history","🗣️ 3. WHAT WILL I ASK?","Write the actual questions you would ask the patient."],
["look","👀 4. WHAT WILL I LOOK FOR?","General examination findings."],
["check","🩺 5. WHAT WILL I CHECK?","Vitals, examination and practical skills. Mark unknown skills ⭐."],
["interpret","🧩 6. WHAT DO THE FINDINGS MEAN?","Normal vs abnormal; clinical interpretation."],
["investigations","🔬 7. INVESTIGATIONS","Investigation → why it is ordered."],
["management","💊 8. MANAGEMENT","Basic clinical approach + urgent/referral points."],
["ayurveda","🌿 9. AYURVEDA CONNECTION","Meaningful Nidana, Dosha, Dushya, Srotas, Samprapti, Chikitsa."],
["viva","🎤 10. VIVA","5–10 viva questions + short answers."],
["weak","⭐ 11. MY WEAK POINTS","Things I don't know or need to practice."],
["practice","🧪 12. PRACTICAL PRACTICE","What I physically practiced + result/feedback."]
];
function key(){return sel.c+"|"+sel.x}function esc(x){return String(x||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function renderList(){let q=document.getElementById("search").value.toLowerCase(),e=document.getElementById("list");e.innerHTML="";Object.entries(DATA).forEach(([c,a])=>{let b=a.filter(x=>x.toLowerCase().includes(q));if(!b.length)return;e.innerHTML+=`<div class=cat>${c}</div>`;b.forEach(x=>{let d=document.createElement("div");d.className="topic "+(sel&&sel.c==c&&sel.x==x?"active":"");d.textContent=x;d.onclick=()=>select({c,x});e.appendChild(d)})})}
function select(it){sel=it;document.getElementById("result").textContent=it.x;let n=S[key()]||{},e=document.getElementById("editor");e.innerHTML=`<div class=hint>${it.c} · Your personal diary page</div><label><b>📅 Date</b><input id=date value="${esc(n.date||new Date().toLocaleDateString())}"></label><br><label><b>⭐ Status</b><select id=status><option value=learning>Learning</option><option value=practiced>Practiced</option><option value=done>Completed</option></select></label>`+fields.map(f=>`<div class=section><b>${f[1]}</b><div class=hint>${f[2]}</div><textarea id=${f[0]} placeholder="Write short, exam-useful notes here...">${esc(n[f[0]])}</textarea></div>`).join("")+`<br><button class="btn primary" id=save>💾 Save diary page</button> <button class=btn id=clear>Clear</button>`;
document.getElementById("status").value=n.status||"learning";document.getElementById("save").onclick=save;document.getElementById("clear").onclick=()=>{if(confirm("Clear this diary page?")){delete S[key()];saveStore();select(sel)}}}
function save(){let n={date:date.value,status:status.value};fields.forEach(f=>n[f[0]]=document.getElementById(f[0]).value);S[key()]=n;saveStore();alert("Saved ❤️")}
function saveStore(){localStorage.setItem("bamsDiary",JSON.stringify(S));stats();renderList()}
function stats(){let v=Object.values(S);done.textContent=v.filter(x=>x.status=="done").length;notes.textContent=v.filter(x=>Object.values(x).some(y=>typeof y=="string"&&y.trim()&&y!=x.date)).length;let ds=new Set(v.map(x=>x.date)),d=new Date(),st=0;while(ds.has(d.toLocaleDateString())){st++;d.setDate(d.getDate()-1)}streak.textContent=st}
function spin(){let it=flat[Math.floor(Math.random()*flat.length)];select(it);result.textContent="🎉 "+it.x}
search.oninput=renderList;spin.onclick=spin;renderList();stats();
</script></body></html>
